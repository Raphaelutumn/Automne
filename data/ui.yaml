# 界面文案词表（单一事实来源）
#
# 用法：模板里给元素加 data-i18n="key"（或 data-i18n-placeholder /
# data-i18n-aria-label / data-i18n-title / data-i18n-alt），
# 前端 assets/js/ui-i18n.js 会把 data/ui.yaml 注入浏览器并切换文案。
# 带数字的文案用 {count}、{index}、{title} 占位，模板侧用 data-i18n-vars 传值。
#
# 注意：这里只放"界面文案"。文章、相册标题、作品资料等内容保持原样，不要放进来。
#
# page.* 是各页面顶部的一级/二级标题与副标题（即 front matter 里的标题、描述）。
# 它们本来写在 content/*/_index.md 里，这里放的是三语版本：
# 中文值要与正文保持一致，改了正文记得同步这里；{count} 这类占位由模板传值。

